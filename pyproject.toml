[project]
name = "absmon"
version = "0.1.0"
description = "Consumer ABS servicer-report ingestion and surveillance"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "pyarrow>=14",
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "pdfplumber>=0.10",
  "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
